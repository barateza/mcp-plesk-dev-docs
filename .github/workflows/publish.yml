name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI + MCP Registry
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-plesk-dev-docs
    permissions:
      id-token: write  # Required for Trusted Publishing / OIDC
      contents: write  # Needed to push server.json update back to main
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-runs: if the tag is moved or a run is retried, the
          # files for that version may already exist. PyPI rejects duplicates
          # outright (red run for an upload that already succeeded), so skip
          # them instead. A genuinely new version still publishes normally.
          skip-existing: true

      - name: Checkout repository (for server.json)
        uses: actions/checkout@v4
        with:
          # Check out main, not the detached tag: with a detached HEAD the
          # commit below cannot fast-forward onto a main that moved while the
          # job ran, which made this step fail on every release.
          ref: main
          fetch-depth: 0

      - name: Update server.json version from tag
        run: |
          # workflow_dispatch on a branch has no version to take: GITHUB_REF_NAME
          # would be "main", and the sed below would write that into server.json.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::server.json is bumped from the release tag; run this workflow on a v* tag."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating server.json version to $VERSION"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/g" server.json

      - name: Commit server.json update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage FIRST. `git diff --staged` compares the index with HEAD, so
          # before `git add` it is always clean: the previous order exited 0 on
          # every release and never committed the bump, silently leaving
          # server.json stale. `--cached` is the same comparison, spelled for
          # what it reads.
          git add server.json
          if git diff --cached --quiet; then
            echo "server.json already matches ${GITHUB_REF_NAME#v}; nothing to commit."
            exit 0
          fi
          git commit -m "chore: bump server.json to ${GITHUB_REF_NAME#v} [skip ci]"
          git push

      # Manual step after CI completes:
      #   mcp-publisher login github
      #   mcp-publisher publish
